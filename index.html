function pickExercises(zones, equipment, health) {
  const eq = equipment && equipment.length ? equipment : ["aucun"];
  return EXERCISE_DB.filter((ex) => {
    const zoneMatch = zones.includes("corps entier") ? true : zones.includes(ex.zone) || ex.zone === "corps entier";
    const equipMatch = ex.equip.some((e) => eq.includes(e));
    const healthOk = !ex.avoid.some((a) => health.includes(a));
    return zoneMatch && equipMatch && healthOk;
  }).slice(0, 8);
}

function calcBMI(weightKg, heightCm) {
  const h = heightCm / 100;
  return weightKg / (h * h);
}
function bmiCategory(bmi) {
  if (bmi < 18.5) return { label: "Insuffisance pondérale", pct: (bmi / 18.5) * 20 };
  if (bmi < 25) return { label: "Poids normal", pct: 20 + ((bmi - 18.5) / (25 - 18.5)) * 30 };
  if (bmi < 30) return { label: "Surpoids", pct: 50 + ((bmi - 25) / (30 - 25)) * 25 };
  return { label: "Obésité", pct: Math.min(100, 75 + ((bmi - 30) / 10) * 25) };
}
function calcTDEE(weightKg, heightCm, age, gender, activity) {
  const base = gender === "femme"
    ? 10 * weightKg + 6.25 * heightCm - 5 * age - 161
    : gender === "homme"
    ? 10 * weightKg + 6.25 * heightCm - 5 * age + 5
    : 10 * weightKg + 6.25 * heightCm - 5 * age - 78; // moyenne neutre pour "autre"
  return base * (ACTIVITY_FACTOR[activity] || 1.375);
}
function calcPlan(profile) {
  const { weight, targetWeight, height, age, gender, activityLevel, goal } = profile;
  const bmi = calcBMI(weight, height);
  const diffKg = targetWeight - weight; // négatif = perte, positif = prise
  const weeklyRateKg = 0.5; // rythme sûr et durable
  const weeks = Math.max(2, Math.ceil(Math.abs(diffKg) / weeklyRateKg));
  const days = weeks * 7;
  const tdee = calcTDEE(weight, height, age, gender, activityLevel);
  const dailyCalAdjust = (Math.abs(diffKg) * 7700) / days; // 7700 kcal ≈ 1kg de masse grasse
  let targetCal = diffKg < 0 ? tdee - dailyCalAdjust : tdee + dailyCalAdjust;
  targetCal = Math.max(gender === "femme" ? 1300 : 1500, Math.round(targetCal));
  const proteinPerKg = goal === "muscle" ? 1.9 : 2.0;
  const proteinG = Math.round(weight * proteinPerKg);
  const fatCal = targetCal * 0.27;
  const fatG = Math.round(fatCal / 9);
  const proteinCal = proteinG * 4;
  const carbsG = Math.max(50, Math.round((targetCal - fatCal - proteinCal) / 4));
  const waterMl = Math.round(weight * 35);
  const waterGlasses = Math.round(waterMl / 250);
  return { bmi, diffKg, weeks, days, tdee: Math.round(tdee), targetCal, proteinG, carbsG, fatG, waterGlasses };
}

function trainingDurationRest(level) {
  if (level === "debutant") return { duration: 30, rest: 90 };
  if (level === "intermediaire") return { duration: 45, rest: 60 };

}

function difficultyTier(level) { return Math.floor((level - 1) / 10); } // +1 palier tous les 10 niveaux
function tierMult(level) { return 1 + difficultyTier(level) * 0.15; } // +15% de difficulté par palier
function xpToNext(level) { return Math.round((100 + (level - 1) * 40) * tierMult(level)); }

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (typeof parsed.onboarded === "undefined") parsed.onboarded = true; // pre-existing saves skip the quiz
      return parsed;
    }
  } catch (e) {}
  return defaultState();
}
function saveState(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function Bar({ value, max, color, height = 8 }) {
  const pct = Math.max(0, Math.min(100, (value / max) * 100));
  return (
    <div style={{ width: "100%", background: "#1A2330", borderRadius: 2, overflow: "hidden", height }}>
      <div style={{ height: "100%", width: pct + "%", background: color, boxShadow: "0 0 8px " + color + "99", transition: "width .5s" }} />
    </div>

function DragPicker({ value, onChange, min, max, step = 1, format, sub }) {
  const dragRef = useRef({ startY: 0, startVal: value, dragging: false });
  const SENSITIVITY = 4; // px per step

  function clamp(v) { return Math.min(max, Math.max(min, v)); }

  function onDown(clientY) {
    dragRef.current = { startY: clientY, startVal: value, dragging: true };
  }
  function onMove(clientY) {
    if (!dragRef.current.dragging) return;
    const deltaSteps = Math.round((dragRef.current.startY - clientY) / SENSITIVITY);
    onChange(clamp(dragRef.current.startVal + deltaSteps * step));
  }
  function onUp() { dragRef.current.dragging = false; }

  return (
    <div style={{ userSelect: "none" }}>
      <div
        onPointerDown={(e) => { e.currentTarget.setPointerCapture(e.pointerId); onDown(e.clientY); }}
        onPointerMove={(e) => onMove(e.clientY)}
        onPointerUp={onUp}
        onPointerCancel={onUp}
        style={{
          border: "1.5px solid " + ACCENT, borderRadius: 20, padding: "28px 20px", textAlign: "center",
          background: "linear-gradient(145deg, #101826, #0A0F17)", boxShadow: "0 0 16px " + ACCENT + "25",
          touchAction: "none", cursor: "ns-resize",
        }}
      >
        <div style={{ fontSize: 11, color: "#7C8896", marginBottom: 6 }}>▲ glisse vers le haut / bas ▼</div>
        <div className="font-hud" style={{ fontSize: 42, fontWeight: 700, color: ACCENT, textShadow: "0 0 16px " + ACCENT + "80" }}>
          {format ? format(value) : value}
        </div>
        {sub && <div style={{ fontSize: 12, color: "#7C8896", marginTop: 4 }}>{sub}</div>}
      </div>
      <div style={{ display: "flex", gap: 10, marginTop: 12, justifyContent: "center" }}>
        <RoundButton onClick={() => onChange(clamp(value - step))}>−</RoundButton>
        <RoundButton onClick={() => onChange(clamp(value + step))}>+</RoundButton>
      </div>
    </div>
  );
}

function WeightChart({ start, target, weeks }) {
  const w = 280, h = 140, pad = 24;
  const minV = Math.min(start, target) - 2, maxV = Math.max(start, target) + 2;
  const x0 = pad, x1 = w - pad, y0 = h - pad, y1 = pad;
  const yFor = (v) => y0 - ((v - minV) / (maxV - minV)) * (y0 - y1);
  return (
    <svg width="100%" viewBox={"0 0 " + w + " " + h}>
      <line x1={x0} y1={y0} x2={x1} y2={y0} stroke="#233041" strokeWidth="1" />
      <line x1={x0} y1={y1} x2={x0} y2={y0} stroke="#233041" strokeWidth="1" />
      <line x1={x0} y1={yFor(start)} x2={x1} y2={yFor(target)} stroke={ACCENT} strokeWidth="2.5" style={{ filter: "drop-shadow(0 0 4px " + ACCENT + ")" }} />
      <circle cx={x0} cy={yFor(start)} r="4" fill={ACCENT} />
      <circle cx={x1} cy={yFor(target)} r="4" fill={ACCENT} />
      <text x={x0} y={y0 + 16} fill="#7C8896" fontSize="9" textAnchor="start">Départ · {start}kg</text>
      <text x={x1} y={y0 + 16} fill="#7C8896" fontSize="9" textAnchor="end">Objectif · {target}kg</text>
      <text x={(x0 + x1) / 2} y={y1 - 8} fill="#7C8896" fontSize="9" textAnchor="middle">{weeks} semaines</text>
    </svg>
  );
}

function Onboarding({ onComplete }) {
  const [step, setStep] = useState(0);
  const [revealing, setRevealing] = useState(false);
  const [answers, setAnswers] = useState({
    name: "", gender: null, goal: null, motivation: null,
    zones: [], level: null, activityLevel: null,
    heightUnit: "cm", height: 170, weight: 70, targetWeight: 65, age: 25,
    health: [], equipment: [], frequency: 3, days: [], daysError: null,
  });

  function set(field, value) { setAnswers((p) => ({ ...p, [field]: value })); }
  function toggleMulti(field, key, exclusiveKey) {
    setAnswers((p) => {
      let arr = p[field] || [];
      if (exclusiveKey && key === exclusiveKey) arr = arr.includes(key) ? [] : [exclusiveKey];
      else if (exclusiveKey && arr.includes(exclusiveKey)) arr = [key];
      else arr = arr.includes(key) ? arr.filter((x) => x !== key) : [...arr, key];
      return { ...p, [field]: arr };
    });
  }
  function toggleDay(k) {
    setAnswers((p) => {
      const arr = p.days.includes(k) ? p.days.filter((x) => x !== k) : [...p.days, k];
      return { ...p, days: arr, daysError: null };
    });
  }

  const STEPS = ["notif", "name", "gender", "goal", "motivation", "zones", "level", "activity", "height", "weight", "targetWeight", "age", "health", "equipment", "frequency", "days", "results"];
  const idx = STEPS[step];

  const canNext =
    idx === "notif" ? true :
    idx === "name" ? answers.name.trim().length > 0 :
    idx === "gender" ? !!answers.gender :
    idx === "goal" ? !!answers.goal :
    idx === "motivation" ? !!answers.motivation :
    idx === "zones" ? answers.zones.length > 0 :
    idx === "level" ? !!answers.level :
    idx === "activity" ? !!answers.activityLevel :
    idx === "height" ? true :
    idx === "weight" ? true :
    idx === "targetWeight" ? true :
    idx === "age" ? true :
    idx === "health" ? answers.health.length > 0 :
    idx === "equipment" ? answers.equipment.length > 0 :
    idx === "frequency" ? true :
    idx === "days" ? true :
    true;

  function next() {
    if (idx === "days") {
      if (answers.days.length !== answers.frequency) {
        set("daysError", "Tu as choisi " + answers.frequency + "x par semaine — sélectionne exactement " + answers.frequency + " jour(s), pas plus, pas moins.");
        return;
      }
    }
    if (step < STEPS.length - 1) setStep(step + 1);
  }
  function back() { if (step > 0) setStep(step - 1); }

  function beginAdventure() {
    setRevealing(true);
    setTimeout(() => finish(), 2200);
  }

  function finish() {
    const cls = CLASSES[GOAL_STAT[answers.goal]];
    const lvl = RANKS[answers.level];
    const plan = calcPlan({ weight: answers.weight, targetWeight: answers.targetWeight, height: answers.height, age: answers.age, gender: answers.gender, activityLevel: answers.activityLevel, goal: answers.goal });
    const exercises = pickExercises(answers.zones, answers.equipment, answers.health);
    const durRest = trainingDurationRest(answers.level);
    onComplete({
      name: answers.name.trim() || "Aventurier",
      gender: answers.gender, goal: answers.goal, motivation: answers.motivation,
      zones: answers.zones, level: answers.level, activityLevel: answers.activityLevel,
      height: answers.height, weight: answers.weight, targetWeight: answers.targetWeight, age: answers.age,
      health: answers.health, equipment: answers.equipment, frequency: answers.frequency, days: answers.days,
      className: cls.name, rankName: lvl.name, bonus: lvl.bonus,
      plan, exercises, durRest,
    });
  }

  if (revealing) {
    const cls = CLASSES[GOAL_STAT[answers.goal]];
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", padding: 24, textAlign: "center", background: "transparent" }}>
        <div className="font-hud" style={{ color: "#7C8896", fontSize: 12, letterSpacing: 2, marginBottom: 16 }}>ÉVEIL DU SYSTÈME EN COURS...</div>
        <div style={{ fontSize: 56, marginBottom: 12, animation: "pulse 1.2s infinite" }}>{cls.emoji}</div>
        <div className="font-hud" style={{ fontSize: 22, fontWeight: 700, color: ACCENT, textShadow: "0 0 20px " + ACCENT }}>
          CLASSE : {cls.name.toUpperCase()}
        </div>
        <style>{"@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.08)}}"}</style>
      </div>
    );
  }

  // ---- notification / accept screen ----
  if (idx === "notif") {
    return (
      <div style={{ minHeight: "100vh", background: "transparent", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
        <div style={{ maxWidth: 380, width: "100%" }}>
          <Panel style={{ textAlign: "center", padding: "28px 22px" }}>
            <div className="font-hud" style={{ fontSize: 11, color: ACCENT, letterSpacing: 2, marginBottom: 14 }}>NOTIFICATION</div>
            <div style={{ fontSize: 15, lineHeight: 1.6, color: "#E7ECEF", marginBottom: 22 }}>
              Vous avez acquis les qualifications pour devenir un joueur.
            </div>
            <RoundButton onClick={next} active full>Accepter ?</RoundButton>
          </Panel>
        </div>
      </div>
    );
  }

  // ---- results page ----
  if (idx === "results") {
    const plan = calcPlan({ weight: answers.weight, targetWeight: answers.targetWeight, height: answers.height, age: answers.age, gender: answers.gender, activityLevel: answers.activityLevel, goal: answers.goal });
    const cat = bmiCategory(plan.bmi);
    const exercises = pickExercises(answers.zones, answers.equipment, answers.health);
    const durRest = trainingDurationRest(answers.level);
    return (
      <div style={{ minHeight: "100vh", padding: "20px 16px 40px", background: "transparent" }}>
        <h1 className="font-hud" style={{ fontSize: 18, fontWeight: 700, marginBottom: 14, textAlign: "center" }}>Ton profil est prêt</h1>

        <Panel>
          <div className="font-hud" style={{ fontSize: 12, color: ACCENT, marginBottom: 8 }}>ÉVOLUTION PRÉVUE</div>
          <WeightChart start={answers.weight} target={answers.targetWeight} weeks={plan.weeks} />
        </Panel>

        <Panel>
          <div className="font-hud" style={{ fontSize: 12, color: ACCENT, marginBottom: 10 }}>TON IMC</div>
          <BMIGauge bmi={plan.bmi} category={cat} />
        </Panel>

        <Panel>
          <div className="font-hud" style={{ fontSize: 12, color: ACCENT, marginBottom: 10 }}>RÉCAPITULATIF</div>
          {[
            ["Genre", GENDERS[answers.gender].label],
            ["Objectif", GOALS[answers.goal]],
            ["Motivation", MOTIVATION_OPTIONS[answers.motivation]],
            ["Zones ciblées", answers.zones.map((z) => ZONES[z]).join(", ")],

          <div style={{ fontSize: 11, color: "#7C8896", marginTop: 4 }}>{answers.days.map((d) => WEEK_DAYS.find((w) => w.k === d).l).join(" · ")}</div>
        </Panel>

        <Panel>
          <div className="font-hud" style={{ fontSize: 12, color: ACCENT, marginBottom: 8 }}>CONSEILS DU SYSTÈME</div>
          <div style={{ fontSize: 12.5, lineHeight: 1.6, color: "#E7ECEF" }}>
            Concentrez-vous sur un déficit calorique durable via l'alimentation et l'exercice. Priorisez les aliments complets, un apport protéique adéquat pour préserver vos muscles et une activité cardio-vasculaire régulière. Restez constant et patient.
          </div>
        </Panel>

        <Panel>
          <div className="font-hud" style={{ fontSize: 12, color: ACCENT, marginBottom: 10 }}>EXERCICES RECOMMANDÉS</div>
          {exercises.length === 0 && <div style={{ fontSize: 12, color: "#7C8896" }}>Pas d'exercice trouvé pour cette combinaison — ajuste zones ou équipement plus tard.</div>}
          {exercises.map((ex) => (
            <div key={ex.name} style={{ marginBottom: 12, paddingBottom: 12, borderBottom: "1px solid #182230" }}>
              <div className="font-hud" style={{ fontSize: 13, fontWeight: 700, color: "#E7ECEF", marginBottom: 4 }}>{ex.name}</div>
              <div style={{ fontSize: 11.5, color: "#B9C2CC", lineHeight: 1.5 }}>{ex.how}</div>

          ))}
        </Panel>

        <div style={{ fontSize: 10, color: "#5A6572", lineHeight: 1.5, textAlign: "center", padding: "8px 10px 20px" }}>
          Les informations fournies sont uniquement à titre de référence générale et ne doivent pas remplacer un avis médical professionnel.
        </div>

        <RoundButton onClick={beginAdventure} active full>Commencer l'aventure</RoundButton>
      </div>
    );
  }

  // ---- generic step wrapper for all remaining steps ----
  return (
    <div style={{ minHeight: "100vh", padding: "24px 20px 40px", display: "flex", flexDirection: "column", background: "transparent" }}>
      <div style={{ display: "flex", gap: 3, marginBottom: 24 }}>
        {STEPS.slice(1, -1).map((s, i) => (
          <div key={s} style={{ flex: 1, height: 3, borderRadius: 2, background: (i + 1) <= step ? ACCENT : "#1A2330" }} />
        ))}
      </div>

      {idx === "name" && (
        <div>
          <h1 className="font-hud" style={{ fontSize: 20, fontWeight: 700, marginBottom: 8 }}>Comment le Système doit-il t'appeler ?</h1>
          <p style={{ fontSize: 12, color: "#7C8896", marginBottom: 20 }}>Ton nom de joueur, modifiable plus tard.</p>
          <input autoFocus value={answers.name} onChange={(e) => set("name", e.target.value)} placeholder="Ton nom..."
            style={{ width: "100%", background: "#131C27", border: "1.5px solid " + ACCENT, borderRadius: 12, padding: "12px 14px", fontSize: 15, outline: "none", color: "#E7ECEF" }} />
        </div>
      )}

      {idx === "gender" && (
        <div>
          <h1 className="font-hud" style={{ fontSize: 20, fontWeight: 700, marginBottom: 20 }}>Ton genre ?</h1>
          {Object.entries(GENDERS).map(([k, g], i) => (
            <OptionCard key={k} emoji={g.emoji} title={g.label} active={answers.gender === k} accent={ACCENT} onClick={() => set("gender", k)} delay={i * 0.12} />

      {idx === "goal" && (
        <div>
          <h1 className="font-hud" style={{ fontSize: 20, fontWeight: 700, marginBottom: 20 }}>Ton objectif ?</h1>

            <OptionCard key={k} emoji="🎯" title={label} active={answers.goal === k} accent={ACCENT} onClick={() => set("goal", k)} delay={i * 0.12} />
          ))}
        </div>
      )}

      {idx === "motivation" && (
        <div>
          <h1 className="font-hud" style={{ fontSize: 20, fontWeight: 700, marginBottom: 20 }}>Qu'est-ce qui vous motive à vous entraîner ?</h1>
          {Object.entries(MOTIVATION_OPTIONS).map(([k, label], i) => (
            <OptionCard key={k} emoji="✨" title={label} active={answers.motivation === k} accent={ACCENT} onClick={() => set("motivation", k)} delay={i * 0.1} />

      {idx === "zones" && (

      {idx === "height" && (
        <div>
          <h1 className="font-hud" style={{ fontSize: 20, fontWeight: 700, marginBottom: 6 }}>Ta taille ?</h1>
          <div style={{ display: "flex", justifyContent: "center", gap: 0, marginBottom: 18 }}>

            <button onClick={() => set("heightUnit", "ft")} className="font-hud" style={{ padding: "6px 16px", borderRadius: "0 999px 999px 0", border: "1.5px solid " + ACCENT, borderLeft: "none", background: answers.heightUnit === "ft" ? ACCENT : "transparent", color: answers.heightUnit === "ft" ? "#06101F" : ACCENT, fontSize: 12, fontWeight: 700 }}>ft</button>
          </div>

      {idx === "weight" && (

      {idx === "health" && (
        <div>
          <h1 className="font-hud" style={{ fontSize: 20, fontWeight: 700, marginBottom: 6 }}>Problèmes de santé ?</h1>
          <p style={{ fontSize: 12, color: "#7C8896", marginBottom: 18 }}>Pour éviter les exercices à risque.</p>

      {idx === "equipment" && (
        <div>
          <h1 className="font-hud" style={{ fontSize: 20, fontWeight: 700, marginBottom: 6 }}>Équipement disponible ?</h1>
          <p style={{ fontSize: 12, color: "#7C8896", marginBottom: 18 }}>Sélection multiple possible.</p>
          <MultiPicker options={EQUIPMENT} selected={answers.equipment} onToggle={(k) => toggleMulti("equipment", k, "aucun")} />
        </div>
      )}

      {idx === "frequency" && (
        <div>
          <h1 className="font-hud" style={{ fontSize: 20, fontWeight: 700, marginBottom: 24 }}>Fréquence d'entraînement ?</h1>
          <FrequencyDots value={answers.frequency} onChange={(v) => set("frequency", v)} />
        </div>
      )}

      {idx === "days" && (
        <div>
          <h1 className="font-hud" style={{ fontSize: 20, fontWeight: 700, marginBottom: 20 }}>Quels jours ?</h1>
          <DaySelector frequency={answers.frequency} selected={answers.days} onToggle={toggleDay} error={answers.daysError} />
        </div>
      )}

      <div style={{ flex: 1 }} />
      <div style={{ display: "flex", gap: 10, marginTop: 24 }}>
        {step > 0 && <RoundButton onClick={back}>← Retour</RoundButton>}
        <div style={{ flex: 1 }}>
          <RoundButton onClick={next} active={canNext} full style={{ opacity: canNext ? 1 : 0.4, pointerEvents: canNext ? "auto" : "none" }}>
            Suivant →
          </RoundButton>
        </div>
      </div>
    </div>
  );
}



function MotionCue() {
  return (
    <div style={{ display: "flex", justifyContent: "center", margin: "4px 0 16px" }}>
      <div style={{ position: "relative", width: 64, height: 64 }}>
        <div style={{ position: "absolute", inset: 0, borderRadius: "50%", border: "1.5px dashed #2F7FFF55" }} />
        <div style={{ position: "absolute", left: "50%", top: "50%", width: 14, height: 14, marginLeft: -7, marginTop: -7, borderRadius: "50%", background: "#2F7FFF", boxShadow: "0 0 12px #2F7FFF", animation: "motionBounce 1.1s ease-in-out infinite" }} />
      </div>
      <style>{"@keyframes motionBounce{0%,100%{transform:translateY(-14px)}50%{transform:translateY(14px)}}"}</style>
    </div>
  );
}

function NutritionTab({ foodLog, plan, onAdd, onRemove }) {
  const [suggestion, setSuggestion] = useState({ matin: null, midi: null, soir: null });
  const [manual, setManual] = useState({ open: false, name: "", kcal: "", protein: "", carbs: "", fat: "" });

  const totals = foodLog.reduce((acc, e) => ({
    kcal: acc.kcal + (e.kcal || 0), protein: acc.protein + (e.protein || 0),
    carbs: acc.carbs + (e.carbs || 0), fat: acc.fat + (e.fat || 0),
  }), { kcal: 0, protein: 0, carbs: 0, fat: 0 });

  function suggest(meal) { setSuggestion((p) => ({ ...p, [meal]: generateRecipe(meal) })); }

  function submitManual() {
    if (!manual.name.trim()) return;
    onAdd({
      name: manual.name.trim(),
      kcal: Number(manual.kcal) || 0, protein: Number(manual.protein) || 0,
      carbs: Number(manual.carbs) || 0, fat: Number(manual.fat) || 0,
    });
    setManual({ open: false, name: "", kcal: "", protein: "", carbs: "", fat: "" });
  }

  const MEAL_LABELS = { matin: "🌅 Petit-déjeuner", midi: "☀️ Déjeuner", soir: "🌙 Dîner" };

  return (
    <Section title="Nutrition" emoji="🍽️">
      <Panel>
        <div className="font-hud" style={{ fontSize: 12, color: ACCENT, marginBottom: 10 }}>AUJOURD'HUI</div>
        <div style={{ display: "flex", justifyContent: "space-around", textAlign: "center", marginBottom: plan ? 10 : 0 }}>
          <div><div className="font-hud" style={{ fontSize: 18, fontWeight: 700 }}>{Math.round(totals.kcal)}</div><div style={{ fontSize: 9, color: "#7C8896" }}>kcal{plan ? " / " + plan.targetCal : ""}</div></div>
          <div><div className="font-hud" style={{ fontSize: 18, fontWeight: 700, color: "#FF6B5C" }}>{Math.round(totals.protein)}g</div><div style={{ fontSize: 9, color: "#7C8896" }}>protéines</div></div>
          <div><div className="font-hud" style={{ fontSize: 18, fontWeight: 700, color: "#E8B44A" }}>{Math.round(totals.carbs)}g</div><div style={{ fontSize: 9, color: "#7C8896" }}>glucides</div></div>
          <div><div className="font-hud" style={{ fontSize: 18, fontWeight: 700, color: "#5CC8FF" }}>{Math.round(totals.fat)}g</div><div style={{ fontSize: 9, color: "#7C8896" }}>lipides</div></div>
        </div>
        {plan && (
          <div>
            <Bar value={totals.kcal} max={plan.targetCal} color={ACCENT} height={6} />
            <div style={{ fontSize: 9, color: "#7C8896", marginTop: 4, textAlign: "center" }}>
              Objectif : {plan.targetCal} kcal · {plan.proteinG}g P · {plan.carbsG}g G · {plan.fatG}g L
            </div>
          </div>
        )}
      </Panel>

      {["matin", "midi", "soir"].map((meal) => (
        <Panel key={meal}>
          <div className="font-hud" style={{ fontSize: 12, color: ACCENT, marginBottom: 10 }}>{MEAL_LABELS[meal].toUpperCase()}</div>
          {suggestion[meal] ? (
            <div>
              <div style={{ fontSize: 13, color: "#E7ECEF", marginBottom: 6 }}>{suggestion[meal].name}</div>
              <div style={{ fontSize: 10.5, color: "#7C8896", fontFamily: "monospace", marginBottom: 10 }}>
                {suggestion[meal].kcal} kcal · {suggestion[meal].protein}g P · {suggestion[meal].carbs}g G · {suggestion[meal].fat}g L
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <RoundButton onClick={() => suggest(meal)} style={{ flex: 1 }}>🔀 Une autre idée</RoundButton>
                <RoundButton onClick={() => { onAdd({ name: suggestion[meal].name, kcal: suggestion[meal].kcal, protein: suggestion[meal].protein, carbs: suggestion[meal].carbs, fat: suggestion[meal].fat }); setSuggestion((p) => ({ ...p, [meal]: null })); }} active style={{ flex: 1 }}>✓ Ajouter</RoundButton>
              </div>
            </div>
          ) : (
            <RoundButton onClick={() => suggest(meal)} full>Suggérer une recette</RoundButton>
          )}
        </Panel>
      ))}

      <Panel>
        <div className="font-hud" style={{ fontSize: 12, color: ACCENT, marginBottom: 10 }}>AJOUT RAPIDE</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {FOOD_DB.map((f) => (
            <button key={f.name} onClick={() => onAdd(f)} className="font-hud"
              style={{ fontSize: 10.5, padding: "6px 10px", borderRadius: 999, border: "1px solid #233041", background: "#0F1621", color: "#B9C2CC" }}>
              {f.name}
            </button>
          ))}
        </div>
      </Panel>

      <Panel>
        {!manual.open ? (
          <RoundButton onClick={() => setManual((p) => ({ ...p, open: true }))} full>+ Aliment libre</RoundButton>
        ) : (
          <div>
            <input value={manual.name} onChange={(e) => setManual((p) => ({ ...p, name: e.target.value }))} placeholder="Nom de l'aliment / boisson"
              style={{ width: "100%", background: "#131C27", border: "1px solid #233041", borderRadius: 8, padding: "8px 12px", fontSize: 13, outline: "none", color: "#E7ECEF", marginBottom: 8 }} />
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
              <input type="number" value={manual.kcal} onChange={(e) => setManual((p) => ({ ...p, kcal: e.target.value }))} placeholder="kcal"
                style={{ background: "#131C27", border: "1px solid #233041", borderRadius: 8, padding: "8px 10px", fontSize: 12, outline: "none", color: "#E7ECEF" }} />
              <input type="number" value={manual.protein} onChange={(e) => setManual((p) => ({ ...p, protein: e.target.value }))} placeholder="protéines g"
                style={{ background: "#131C27", border: "1px solid #233041", borderRadius: 8, padding: "8px 10px", fontSize: 12, outline: "none", color: "#E7ECEF" }} />
              <input type="number" value={manual.carbs} onChange={(e) => setManual((p) => ({ ...p, carbs: e.target.value }))} placeholder="glucides g"
                style={{ background: "#131C27", border: "1px solid #233041", borderRadius: 8, padding: "8px 10px", fontSize: 12, outline: "none", color: "#E7ECEF" }} />
              <input type="number" value={manual.fat} onChange={(e) => setManual((p) => ({ ...p, fat: e.target.value }))} placeholder="lipides g"
                style={{ background: "#131C27", border: "1px solid #233041", borderRadius: 8, padding: "8px 10px", fontSize: 12, outline: "none", color: "#E7ECEF" }} />
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <RoundButton onClick={() => setManual({ open: false, name: "", kcal: "", protein: "", carbs: "", fat: "" })} style={{ flex: 1 }}>Annuler</RoundButton>
              <RoundButton onClick={submitManual} active style={{ flex: 1 }}>Ajouter</RoundButton>
            </div>
          </div>
        )}
      </Panel>

      <Panel>
        <div className="font-hud" style={{ fontSize: 12, color: ACCENT, marginBottom: 10 }}>JOURNAL DU JOUR</div>
        {foodLog.length === 0 && <div style={{ fontSize: 11, color: "#7C8896", textAlign: "center", padding: "10px 0" }}>Rien d'ajouté aujourd'hui.</div>}
        {foodLog.map((e) => (
          <div key={e.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 0", borderBottom: "1px solid #182230" }}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 12.5, color: "#E7ECEF" }}>{e.name}</div>
              <div style={{ fontSize: 9.5, color: "#7C8896", fontFamily: "monospace" }}>{Math.round(e.kcal)} kcal · {Math.round(e.protein)}P · {Math.round(e.carbs)}G · {Math.round(e.fat)}L</div>
            </div>
            <button onClick={() => onRemove(e.id)} style={{ background: "none", border: "none", color: "#3A4657", flexShrink: 0 }}>🗑</button>
          </div>
        ))}
      </Panel>
    </Section>
  );
}

function TaskDetail({ kind, item, requirePhoto, onClose, onStart }) {
  const already = kind === "daily" && item.done;
  const ytUrl = "https://www.youtube.com/results?search_query=" + encodeURIComponent(item.text + " exercice technique comment faire");
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, zIndex: 55, background: "rgba(0,0,0,.65)", display: "flex", alignItems: "flex-end", justifyContent: "center" }}>
      <div onClick={(e) => e.stopPropagation()} style={{ width: "100%", maxWidth: 480, maxHeight: "88vh", overflowY: "auto", background: "linear-gradient(180deg, #131C27, #0C1218)", borderTop: "1.5px solid #2F7FFF", borderRadius: "18px 18px 0 0", padding: "20px 20px 28px", animation: "slideUp .3s ease" }}>
        <div style={{ display: "flex", justifyContent: "flex-end" }}>
          <button onClick={onClose} style={{ background: "none", border: "none", color: "#7C8896", fontSize: 18 }}>✕</button>

        <h2 className="font-hud" style={{ fontSize: 18, fontWeight: 700, marginTop: -6, marginBottom: 10 }}>{item.text}</h2>
        <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
          <span style={{ fontSize: 11, fontFamily: "monospace", color: STATS[item.stat].color, background: STATS[item.stat].color + "18", border: "1px solid " + STATS[item.stat].color + "40", borderRadius: 6, padding: "3px 8px" }}>
            {STATS[item.stat].emoji} {STATS[item.stat].label}
          </span>
          {item.difficulty && (
            <span style={{ fontSize: 11, fontFamily: "monospace", color: "#7C8896", background: "#1A2330", border: "1px solid #233041", borderRadius: 6, padding: "3px 8px" }}>
              {DIFF[item.difficulty].label}
            </span>
          )}
        </div>
        <MotionCue />
        <div style={{ fontSize: 13, color: "#B9C2CC", lineHeight: 1.6, marginBottom: 14 }}>
          {item.description && item.description.trim() ? item.description : "Aucune description fournie pour cette tâche."}
        </div>
        <a href={ytUrl} target="_blank" rel="noopener noreferrer" className="font-hud"
          style={{ display: "block", textAlign: "center", fontSize: 12.5, fontWeight: 600, color: "#2F7FFF", border: "1.5px solid #2F7FFF", borderRadius: 999, padding: "9px 0", marginBottom: 6, textDecoration: "none" }}>
          🎥 Voir une démo vidéo (YouTube)
        </a>
        <div style={{ fontSize: 10, color: "#5A6572", textAlign: "center", marginBottom: 18 }}>
          Recherche ouverte dans un nouvel onglet — vérifie que la vidéo correspond bien au mouvement décrit ci-dessus.
        </div>
        {already ? (
          <div style={{ fontSize: 12, color: "#4ADE80", fontFamily: "monospace", textAlign: "center", padding: "10px 0" }}>✓ Déjà validée aujourd'hui</div>
        ) : (
          <GlowButton onClick={onStart} accent="#2F7FFF" active full>
            {requirePhoto ? "▶ Commencer (10s + preuve photo)" : "▶ Commencer (10s de concentration)"}
          </GlowButton>
        )}
      </div>
    </div>
  );
}

function CaptureOverlay({ fx, videoRef, streamRef, onCancel }) {
  const previewRef = useRef(null);
  useEffect(() => {
    if (!fx.noCam && previewRef.current && videoRef.current && videoRef.current.srcObject) {
      previewRef.current.srcObject = videoRef.current.srcObject;
      previewRef.current.play().catch(() => {});
    }
  }, [fx.phase]);

  if (fx.phase === "done") {
    return (
      <div style={{ position: "fixed", inset: 0, zIndex: 60, background: "rgba(6,10,15,.96)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24 }}>
        {fx.capturedImg && <img src={fx.capturedImg} alt="preuve" style={{ width: 120, height: 120, objectFit: "cover", borderRadius: 12, border: "2px solid #4ADE80", marginBottom: 16 }} />}
        <div className="font-hud" style={{ fontSize: 18, fontWeight: 700, color: "#4ADE80" }}>✓ Quête validée</div>
      </div>
    );
  }

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 60, background: "rgba(6,10,15,.97)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24, textAlign: "center" }}>
      {!fx.noCam && (
        <video ref={previewRef} playsInline muted style={{ width: 96, height: 96, borderRadius: "50%", objectFit: "cover", border: "2px solid #45E0D1", marginBottom: 24, boxShadow: "0 0 20px #45E0D155" }} />
      )}
      {fx.phase === "countdown" && (
        <React.Fragment>
          <div className="font-hud" style={{ fontSize: 12, color: "#7C8896", letterSpacing: 2, marginBottom: 10 }}>PRÉPARE-TOI...</div>
          <div className="font-hud" style={{ fontSize: 64, fontWeight: 700, color: "#45E0D1", textShadow: "0 0 24px #45E0D1" }}>{fx.n}</div>
        </React.Fragment>
      )}
      {fx.phase === "exercise" && (
        <React.Fragment>
          <div className="font-hud" style={{ fontSize: 16, fontWeight: 700, color: "#4ADE80", marginBottom: 8 }}>GO ! Fais ta quête maintenant</div>
          <div style={{ fontSize: 12, color: "#7C8896", fontFamily: "monospace" }}>
            {fx.noCam ? "Reste concentré..." : (fx.snapped ? "📸 Photo prise" : "La photo peut être prise à tout moment...")}
          </div>
        </React.Fragment>
      )}
      <button onClick={onCancel} className="font-hud" style={{ marginTop: 28, background: "none", border: "1px solid #3A4657", color: "#7C8896", borderRadius: 8, padding: "8px 16px", fontSize: 12 }}>
        Annuler
      </button>
    </div>
  );
}

function App() {
  const [state, setState] = useState(null);
  const [tab, setTab] = useState("dailies");
  const [toast, setToast] = useState(null);
  const [levelUpFx, setLevelUpFx] = useState(false);
  const [addingFor, setAddingFor] = useState(null);
  const [musicOn, setMusicOn] = useState(false);
  const [taskDetail, setTaskDetail] = useState(null); // { kind: 'daily'|'todo', item }
  const [captureFx, setCaptureFx] = useState(null); // { phase: 'countdown'|'exercise'|'done', n, kind, item }
  const [lightbox, setLightbox] = useState(null);
  const toastTimer = useRef(null);
  const audioRef = useRef({ ctx: null, nodes: [] });
  const streamRef = useRef(null);
  const videoRef = useRef(null);

  function startAmbient() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const master = ctx.createGain(); master.gain.value = 0.0001;
      master.connect(ctx.destination);
      master.gain.linearRampToValueAtTime(0.17, ctx.currentTime + 2);

      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass"; filter.frequency.value = 380; filter.Q.value = 0.7;
      filter.connect(master);

      // power-chord drone (root + fifth + octave, E minor) — dark but not dissonant/clashing
      const osc1 = ctx.createOscillator(); osc1.type = "sawtooth"; osc1.frequency.value = 41.2;  // E1
      const osc2 = ctx.createOscillator(); osc2.type = "sine"; osc2.frequency.value = 61.7;       // B1 (fifth)
      const osc3 = ctx.createOscillator(); osc3.type = "triangle"; osc3.frequency.value = 82.4;   // E2 (octave)
      const oscGain = ctx.createGain(); oscGain.gain.value = 0.4;
      osc1.connect(oscGain); osc2.connect(oscGain); osc3.connect(oscGain); oscGain.connect(filter);

      // rhythmic driving pulse — gives motivational forward motion
      const pulseOsc = ctx.createOscillator(); pulseOsc.type = "sine"; pulseOsc.frequency.value = 41.2;
      const pulseGain = ctx.createGain(); pulseGain.gain.value = 0.0001;
      pulseOsc.connect(pulseGain); pulseGain.connect(filter);
      pulseOsc.start();
      const BPM = 92, beatSec = 60 / BPM;
      let pulseTimer = null;
      function schedulePulse() {
        const t = ctx.currentTime;
        pulseGain.gain.cancelScheduledValues(t);
        pulseGain.gain.setValueAtTime(0.001, t);
        pulseGain.gain.linearRampToValueAtTime(0.35, t + 0.03);
        pulseGain.gain.exponentialRampToValueAtTime(0.001, t + beatSec * 0.85);
        pulseTimer = setTimeout(schedulePulse, beatSec * 1000);
      }
      schedulePulse();

      const lfo = ctx.createOscillator(); lfo.type = "sine"; lfo.frequency.value = 0.08;
      const lfoGain = ctx.createGain(); lfoGain.gain.value = 90;
      lfo.connect(lfoGain); lfoGain.connect(filter.frequency);

      const bufSize = ctx.sampleRate * 2;
      const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * 0.25;
      const noise = ctx.createBufferSource(); noise.buffer = buf; noise.loop = true;
      const noiseFilter = ctx.createBiquadFilter(); noiseFilter.type = "bandpass"; noiseFilter.frequency.value = 160; noiseFilter.Q.value = 0.7;
      const noiseGain = ctx.createGain(); noiseGain.gain.value = 0.14;
      noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(filter);

      [osc1, osc2, osc3, lfo, noise].forEach((n) => n.start());

      // brighter, more driving melody — E natural minor, ascending motif, faster pace
      const scale = [164.81, 196.0, 220.0, 246.94, 293.66, 329.63]; // E3, G3, A3, B3, D4, E4
      let melodyStep = 0;
      let melodyTimer = null;
      function scheduleMelody() {
        const wait = beatSec * 2 * 1000; // locked to the pulse tempo
        melodyTimer = setTimeout(() => {
          if (!audioRef.current.ctx) return;
          const t = ctx.currentTime;
          const freq = scale[melodyStep % scale.length];
          melodyStep += (Math.random() > 0.3 ? 1 : 2);
          const note = ctx.createOscillator(); note.type = "triangle"; note.frequency.value = freq;
          const noteFilter = ctx.createBiquadFilter(); noteFilter.type = "lowpass"; noteFilter.frequency.value = 1400;
          const noteGain = ctx.createGain(); noteGain.gain.setValueAtTime(0.0001, t);
          noteGain.gain.linearRampToValueAtTime(0.11, t + 0.08);
          noteGain.gain.exponentialRampToValueAtTime(0.0001, t + beatSec * 1.8);
          note.connect(noteFilter); noteFilter.connect(noteGain); noteGain.connect(master);
          note.start(t); note.stop(t + beatSec * 2);
          scheduleMelody();
        }, wait);
      }
      scheduleMelody();

      // distant epic toll, sparse — keeps a touch of dread without killing the drive
      let tollTimer = null;
      function scheduleToll() {
        const wait = 14000 + Math.random() * 10000;
        tollTimer = setTimeout(() => {
          if (!audioRef.current.ctx) return;
          const t = ctx.currentTime;
          const bell = ctx.createOscillator(); bell.type = "sine"; bell.frequency.value = 82.4;
          const bell2 = ctx.createOscillator(); bell2.type = "sine"; bell2.frequency.value = 123.4;
          const bellGain = ctx.createGain(); bellGain.gain.setValueAtTime(0.0001, t);
          bellGain.gain.linearRampToValueAtTime(0.32, t + 0.15);
          bellGain.gain.exponentialRampToValueAtTime(0.0001, t + 4);
          bell.connect(bellGain); bell2.connect(bellGain); bellGain.connect(filter);
          bell.start(t); bell2.start(t);
          bell.stop(t + 4.2); bell2.stop(t + 4.2);
          scheduleToll();
        }, wait);
      }
      scheduleToll();

      audioRef.current = {
        ctx, nodes: [osc1, osc2, osc3, pulseOsc, lfo, noise], master,
        cleanup: () => { clearTimeout(tollTimer); clearTimeout(melodyTimer); clearTimeout(pulseTimer); },
      };
    } catch (e) {}
  }

  function stopAmbient() {
    const { ctx, nodes, master, cleanup } = audioRef.current;
    if (!ctx) return;
    if (cleanup) cleanup();
    try {
      if (master) master.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.8);
      setTimeout(() => {
        nodes.forEach((n) => { try { n.stop(); } catch (e) {} });
        ctx.close();
      }, 900);
    } catch (e) {}
    audioRef.current = { ctx: null, nodes: [] };
  }

  function toggleMusic() {
    setMusicOn((prev) => {
      if (!prev) startAmbient(); else stopAmbient();
      return !prev;
    });
  }

  useEffect(() => () => stopAmbient(), []);

  useEffect(() => {
    let loaded = loadState();
    const today = todayStr();
    if (loaded.lastLogin !== today) {
      let hp = loaded.character.hp;
      loaded.dailies = loaded.dailies.map((d) => {
        if (!d.done) { hp -= Math.round(3 * DIFF[d.difficulty].mult * tierMult(loaded.character.level)); return { ...d, done: false, streak: 0 }; }
        return { ...d, done: false, streak: (d.streak || 0) + 1 };
      });
      loaded.character.hp = Math.max(0, hp);
      loaded.lastLogin = today;
    }
    setState(loaded);
  }, []);

  useEffect(() => { if (state) saveState(state); }, [state]);

  // Meilleur effort : un message de motivation par jour à l'ouverture (pas de vraie notif en arrière-plan sans serveur push)
  useEffect(() => {
    if (!state || !state.onboarded || !state.motivation) return;
    const today = todayStr();
    if (state.lastMotivDate === today) return;
    const msgs = MOTIVATION_MESSAGES;
    const msg = msgs[state.motivation] || "Une nouvelle journée, une nouvelle quête.";
    setState((prev) => ({ ...prev, lastMotivDate: today }));
    setTimeout(() => {
      showToast(msg, "#2F7FFF");
      if ("Notification" in window) {
        if (Notification.permission === "granted") {
          try { new Notification("Level Up", { body: msg }); } catch (e) {}
        } else if (Notification.permission !== "denied") {
          Notification.requestPermission();
        }
      }
    }, 800);
  }, [state && state.onboarded, state && state.lastMotivDate]);

  function showToast(msg, color = "#45E0D1") {
    setToast({ msg, color });
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2200);
  }

  function applyReward(statKey, mult = 1) {
    setState((prev) => {
      const c = { ...prev.character, stats: { ...prev.character.stats } };
      const gainedXp = Math.round(BASE_XP * mult);
      const gainedGold = Math.round(BASE_GOLD * mult);
      c.xp += gainedXp; c.gold += gainedGold;
      if (statKey) c.stats[statKey] = (c.stats[statKey] || 0) + Math.max(1, Math.round(mult));
      let leveled = false, need = xpToNext(c.level);
      while (c.xp >= need) { c.xp -= need; c.level += 1; c.maxHp += 5; c.hp = c.maxHp; leveled = true; need = xpToNext(c.level); }
      if (leveled) { setLevelUpFx(true); setTimeout(() => setLevelUpFx(false), 1800); showToast("NIVEAU " + c.level + " ATTEINT", "#E8B44A"); }
      else { showToast("+" + gainedXp + " XP  +" + gainedGold + " or", "#45E0D1"); }
      return { ...prev, character: c };
    });
  }
  function applyPenalty(mult = 1) {
    setState((prev) => {
      const c = { ...prev.character };
      const dmg = Math.round(4 * mult * tierMult(c.level));
      c.hp = Math.max(0, c.hp - dmg);
      showToast("-" + dmg + " PV", "#FF5C5C");
      return { ...prev, character: c };
    });
  }
  function applyHeal(amount) {
    setState((prev) => {
      const c = { ...prev.character };
      c.hp = Math.min(c.maxHp, c.hp + amount);
      showToast("+" + amount + " PV", "#4ADE80");
      return { ...prev, character: c };
    });
  }
  function reallyToggleDaily(id) {
    const d = state.dailies.find((x) => x.id === id);
    if (!d) return;
    setState((prev) => ({ ...prev, dailies: prev.dailies.map((x) => (x.id === id ? { ...x, done: !x.done } : x)) }));
    if (!d.done) applyReward(d.stat, DIFF[d.difficulty].mult);
  }
  function reallyCompleteTodo(id) {
    const t = state.todos.find((x) => x.id === id);
    if (!t) return;
    applyReward(t.stat, DIFF[t.difficulty].mult);
    setState((prev) => ({ ...prev, todos: prev.todos.filter((x) => x.id !== id) }));
  }
  function saveProof(taskId, taskName, dataUrl) {
    setState((prev) => ({
      ...prev,
      proofsHistory: [{ id: uid(), taskId, taskName, ts: Date.now(), img: dataUrl }, ...(prev.proofsHistory || [])].slice(0, 400),
    }));
  }
  function latestProofFor(taskId) {
    const hist = (state.proofsHistory || []).filter((p) => p.taskId === taskId);
    return hist.length ? hist[0] : null;
  }

  function requestToggleDaily(id) {
    const d = state.dailies.find((x) => x.id === id);
    if (!d) return;
    if (!d.done) openTaskDetail("daily", d); else reallyToggleDaily(id);
  }
  function requestCompleteTodo(id) {
    const t = state.todos.find((x) => x.id === id);
    if (!t) return;
    openTaskDetail("todo", t);
  }
  function openTaskDetail(kind, item) { setTaskDetail({ kind, item }); }

  async function beginTask(kind, item) {
    setTaskDetail(null);
    if (!state.requirePhoto) {
      setCaptureFx({ phase: "countdown", n: 10, kind, item, noCam: true });
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
      streamRef.current = stream;
      if (videoRef.current) {
        videoRef.current.srcObject = stream;
        try { await videoRef.current.play(); } catch (e) {}
      }
      setCaptureFx({ phase: "countdown", n: 10, kind, item, noCam: false });
    } catch (e) {
      showToast("Caméra indisponible, tâche validée sans preuve", "#FF5C5C");
      finalizeTask(kind, item, null);
    }
  }

  useEffect(() => {
    if (!captureFx) return;
    if (captureFx.phase === "countdown") {
      if (captureFx.n <= 0) {
        const exDuration = 6 + Math.floor(Math.random() * 8); // 6-13s
        const snapAt = 2 + Math.random() * (exDuration - 3); // random moment, not the very start/end
        setCaptureFx((p) => ({ ...p, phase: "exercise", n: exDuration, snapAt, elapsed: 0, snapped: false }));
        return;
      }
      const t = setTimeout(() => setCaptureFx((p) => (p ? { ...p, n: p.n - 1 } : p)), 1000);
      return () => clearTimeout(t);
    }
    if (captureFx.phase === "exercise") {
      if (captureFx.elapsed >= captureFx.n) {
        finishExercisePhase();
        return;
      }
      if (!captureFx.snapped && captureFx.elapsed >= captureFx.snapAt && !captureFx.noCam) {
        snapCandidPhoto();
      }
      const t = setTimeout(() => setCaptureFx((p) => (p ? { ...p, elapsed: p.elapsed + 1 } : p)), 1000);
      return () => clearTimeout(t);
    }
  }, [captureFx]);

  function snapCandidPhoto() {
    setCaptureFx((p) => (p ? { ...p, snapped: true } : p));
    try {
      const video = videoRef.current;
      if (!video || !video.videoWidth) return;
      const canvas = document.createElement("canvas");
      const w = video.videoWidth, h = video.videoHeight;
      const maxW = 220; const scale = Math.min(1, maxW / w);
      canvas.width = Math.max(1, Math.round(w * scale)); canvas.height = Math.max(1, Math.round(h * scale));
      const cctx = canvas.getContext("2d");
      cctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.55);
      setCaptureFx((p) => (p ? { ...p, capturedImg: dataUrl } : p));
    } catch (e) {}
  }

  function finishExercisePhase() {
    const fx = captureFx;
    if (streamRef.current) { streamRef.current.getTracks().forEach((tr) => tr.stop()); streamRef.current = null; }
    if (videoRef.current) videoRef.current.srcObject = null;
    if (!fx) return;
    if (fx.capturedImg) saveProof(fx.item.id, fx.item.text, fx.capturedImg);
    finalizeTask(fx.kind, fx.item, fx.capturedImg || null);
    setCaptureFx({ phase: "done", capturedImg: fx.capturedImg || null });
    setTimeout(() => setCaptureFx(null), 1600);
  }

  function finalizeTask(kind, item, img) {
    if (kind === "daily") reallyToggleDaily(item.id); else reallyCompleteTodo(item.id);
    showToast(img ? "Preuve enregistrée ✅" : "Tâche validée", img ? "#4ADE80" : "#45E0D1");
  }

  function cancelCapture() {
    if (streamRef.current) { streamRef.current.getTracks().forEach((tr) => tr.stop()); streamRef.current = null; }
    if (videoRef.current) videoRef.current.srcObject = null;
    setCaptureFx(null);
  }
  function hitHabit(h) { h.negative ? applyPenalty(1) : (h.heal ? applyHeal(1) : applyReward(h.stat, 1)); }
  function buyReward(r) {
    if (state.character.gold < r.cost) { showToast("Pas assez d'or", "#FF5C5C"); return; }
    setState((prev) => ({ ...prev, character: { ...prev.character, gold: prev.character.gold - r.cost } }));
    showToast("Récompense débloquée", "#E8B44A");
  }
  function addItem(kind, payload) {
    setState((prev) => {
      const item = { id: uid(), ...payload };
      if (kind === "habit") return { ...prev, habits: [...prev.habits, item] };
      if (kind === "daily") return { ...prev, dailies: [...prev.dailies, { ...item, done: false, streak: 0 }] };
      if (kind === "todo") return { ...prev, todos: [...prev.todos, { ...item, done: false }] };
      if (kind === "reward") return { ...prev, rewards: [...prev.rewards, item] };
      return prev;
    });
    setAddingFor(null);
  }
  function removeItem(kind, id) { setState((prev) => ({ ...prev, [kind]: prev[kind].filter((x) => x.id !== id) })); }

  function addFoodEntry(entry) {
    setState((prev) => {
      const day = todayStr();
      const log = { ...(prev.foodLog || {}) };
      log[day] = [...(log[day] || []), { id: uid(), ts: Date.now(), ...entry }];
      return { ...prev, foodLog: log };
    });
    showToast("Ajouté au journal", "#4ADE80");
  }
  function removeFoodEntry(id) {
    setState((prev) => {
      const day = todayStr();
      const log = { ...(prev.foodLog || {}) };
      log[day] = (log[day] || []).filter((x) => x.id !== id);
      return { ...prev, foodLog: log };
    });
  }

  function handleOnboardingComplete(answers) {
    const stat = GOAL_STAT[answers.goal] || "disc";
    const diffByLevel = answers.level === "debutant" ? "easy" : answers.level === "intermediaire" ? "medium" : "hard";
    setState((prev) => {
      const next = { ...prev, onboarded: true, profile: answers, motivation: answers.motivation, lastMotivDate: null };
      next.character = {
        ...prev.character,
        name: answers.name,
        className: answers.className,
        rank: answers.rankName,
        stats: { ...prev.character.stats, [stat]: (prev.character.stats[stat] || 0) + answers.bonus },
      };
      const exerciseDailies = (answers.exercises || []).slice(0, 4).map((ex) => ({
        id: uid(), text: ex.name, description: ex.how, stat, difficulty: diffByLevel, done: false, streak: 0,
      }));
      next.dailies = [...exerciseDailies, ...prev.dailies];
      return next;
    });
  }

  if (!state) return <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center" }}><div style={{ color: "#45E0D1", fontFamily: "monospace" }}>Chargement...</div></div>;

  if (!state.onboarded) return <Onboarding onComplete={handleOnboardingComplete} />;

  const c = state.character;
  const need = xpToNext(c.level);

  return (
    <div style={{ minHeight: "100vh", paddingBottom: 96 }}>
      {levelUpFx && (
        <div style={{ position: "fixed", inset: 0, zIndex: 50, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(0,0,0,.4)", pointerEvents: "none" }}>
          <div className="font-hud" style={{ fontSize: 36, fontWeight: 700, color: "#E8B44A", textShadow: "0 0 20px #E8B44A" }}>LEVEL UP</div>
        </div>
      )}
      {toast && (
        <div className="font-hud" style={{ position: "fixed", top: 12, left: "50%", transform: "translateX(-50%)", zIndex: 50, fontSize: 12, padding: "6px 12px", borderRadius: 4, border: "1px solid " + toast.color, color: toast.color, background: "#0A0E14ee" }}>{toast.msg}</div>
      )}

      <div style={{ position: "sticky", top: 0, zIndex: 40, background: "rgba(10,14,20,.95)", backdropFilter: "blur(4px)", borderBottom: "1px solid #1A2330", padding: "16px 16px 12px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <div className="font-hud" style={{ width: 48, height: 48, borderRadius: "50%", border: "2px solid #45E0D1", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, color: "#45E0D1", fontSize: 18, boxShadow: "0 0 10px #45E0D155", flexShrink: 0 }}>{c.level}</div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <input value={c.name} onChange={(e) => setState((p) => ({ ...p, character: { ...p.character, name: e.target.value } }))}
              className="font-hud" style={{ background: "transparent", border: "none", outline: "none", fontWeight: 600, fontSize: 14, width: "100%", color: "#E7ECEF" }} />
            {c.className && (
              <div className="font-hud" style={{ fontSize: 10, color: "#E8B44A", marginTop: -2 }}>{c.rank} {c.className}</div>
            )}
            <div style={{ display: "flex", alignItems: "center", gap: 4, margin: "4px 0" }}>
              <span style={{ fontSize: 10, fontFamily: "monospace", color: "#7C8896" }}>{c.xp}/{need} XP</span>
            </div>
            <Bar value={c.xp} max={need} color="#45E0D1" height={6} />
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
            <button onClick={toggleMusic} style={{ background: "none", border: "1px solid " + (musicOn ? "#45E0D1" : "#233041"), borderRadius: 6, width: 28, height: 28, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13 }}>
              {musicOn ? "🔊" : "🔇"}
            </button>
            <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
              <span style={{ fontSize: 12 }}>🪙</span>
              <span style={{ fontFamily: "monospace", fontSize: 12, color: "#E8B44A" }}>{c.gold}</span>
            </div>
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 8 }}>
          <span style={{ fontSize: 12 }}>❤️</span>
          <Bar value={c.hp} max={c.maxHp} color="#FF5C5C" height={6} />
          <span style={{ fontSize: 10, fontFamily: "monospace", color: "#7C8896", flexShrink: 0 }}>{c.hp}/{c.maxHp}</span>
        </div>
        <div style={{ display: "flex", gap: 6, marginTop: 8, flexWrap: "wrap" }}>
          {Object.keys(STATS).map((k) => <StatChip key={k} statKey={k} value={c.stats[k] || 0} />)}
        </div>
      </div>

      <div style={{ padding: "16px 16px 0" }}>
        {tab === "dailies" && (
          <Section title="Quotidiennes" emoji="🔁" onAdd={() => setAddingFor("daily")}>
            {state.dailies.map((d) => (
              <SysPanel key={d.id} className="mb2">
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <button onClick={() => requestToggleDaily(d.id)} style={{ width: 24, height: 24, borderRadius: 4, border: "1px solid " + (d.done ? "#4ADE80" : "#233041"), background: d.done ? "#4ADE8033" : "transparent", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                    {d.done && <span style={{ color: "#4ADE80" }}>✓</span>}
                  </button>
                  <div style={{ flex: 1, minWidth: 0, cursor: "pointer" }} onClick={() => openTaskDetail("daily", d)}>
                    <div style={{ fontSize: 14, textDecoration: d.done ? "line-through" : "none", color: d.done ? "#7C8896" : "#E7ECEF" }}>{d.text}</div>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 2 }}>
                      <span style={{ fontSize: 10, fontFamily: "monospace", color: STATS[d.stat].color }}>{STATS[d.stat].label} · {DIFF[d.difficulty].label}</span>
                      {d.streak > 0 && <span style={{ fontSize: 10, fontFamily: "monospace", color: "#E8B44A" }}>🔥{d.streak}</span>}
                      <span style={{ fontSize: 10, color: "#3A4657" }}>ⓘ détails</span>
                    </div>
                  </div>
                  {latestProofFor(d.id) && (
                    <img src={latestProofFor(d.id).img} alt="preuve" style={{ width: 28, height: 28, borderRadius: 4, objectFit: "cover", border: "1px solid #233041", flexShrink: 0 }} />
                  )}
                  <button onClick={() => removeItem("dailies", d.id)} style={{ background: "none", border: "none", color: "#3A4657", flexShrink: 0 }}>🗑</button>
                </div>
              </SysPanel>
            ))}
            {state.dailies.length === 0 && <Empty text="Aucune quotidienne. Ajoute une routine à répéter chaque jour." />}
          </Section>
        )}
        {tab === "habits" && (
          <Section title="Habitudes" emoji="⚔️" onAdd={() => setAddingFor("habit")}>
            {state.habits.map((h) => (
              <SysPanel key={h.id} accent={h.negative ? "#FF5C5C" : h.heal ? "#FF7FC1" : "#4ADE80"}>
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <button onClick={() => hitHabit(h)} style={{ width: 32, height: 32, borderRadius: "50%", border: "1px solid " + (h.negative ? "#FF5C5C" : h.heal ? "#FF7FC1" : "#4ADE80"), color: h.negative ? "#FF5C5C" : h.heal ? "#FF7FC1" : "#4ADE80", background: "none", flexShrink: 0, fontSize: h.heal ? 14 : 16 }}>{h.negative ? "−" : h.heal ? "❤️" : "+"}</button>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 14 }}>{h.text}</div>
                    <span style={{ fontSize: 10, fontFamily: "monospace", color: h.heal ? "#FF7FC1" : STATS[h.stat].color }}>{h.heal ? "+1 PV" : STATS[h.stat].label}</span>
                  </div>
                  <button onClick={() => removeItem("habits", h.id)} style={{ background: "none", border: "none", color: "#3A4657", flexShrink: 0 }}>🗑</button>
                </div>
              </SysPanel>
            ))}
            {state.habits.length === 0 && <Empty text="Aucune habitude. Ajoute un réflexe à encourager ou éviter." />}
          </Section>
        )}
        {tab === "todos" && (
          <Section title="Quêtes" emoji="📋" onAdd={() => setAddingFor("todo")}>
            {state.todos.map((t) => (
              <SysPanel key={t.id}>
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <button onClick={() => requestCompleteTodo(t.id)} style={{ width: 24, height: 24, borderRadius: 4, border: "1px solid #233041", background: "none", flexShrink: 0, color: "#3A4657" }}>✓</button>
                  <div style={{ flex: 1, minWidth: 0, cursor: "pointer" }} onClick={() => openTaskDetail("todo", t)}>
                    <div style={{ fontSize: 14 }}>{t.text}</div>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ fontSize: 10, fontFamily: "monospace", color: STATS[t.stat].color }}>{STATS[t.stat].label} · {DIFF[t.difficulty].label}</span>
                      <span style={{ fontSize: 10, color: "#3A4657" }}>ⓘ détails</span>
                    </div>
                  </div>
                  <button onClick={() => removeItem("todos", t.id)} style={{ background: "none", border: "none", color: "#3A4657", flexShrink: 0 }}>🗑</button>
                </div>
              </SysPanel>
            ))}
            {state.todos.length === 0 && <Empty text="Aucune quête en attente. Ajoute une tâche ponctuelle." />}
          </Section>
        )}
        {tab === "rewards" && (
          <Section title="Récompenses" emoji="🎁" onAdd={() => setAddingFor("reward")}>
            {state.rewards.map((r) => (
              <SysPanel key={r.id} accent="#E8B44A">
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <div style={{ flex: 1, minWidth: 0, fontSize: 14 }}>{r.text}</div>
                  <div style={{ display: "flex", alignItems: "center", gap: 4, fontFamily: "monospace", fontSize: 12, color: "#E8B44A", flexShrink: 0 }}>🪙{r.cost}</div>
                  <button onClick={() => buyReward(r)} className="font-hud" style={{ fontSize: 10, fontWeight: 600, border: "1px solid #E8B44A", color: "#E8B44A", background: "none", borderRadius: 4, padding: "4px 8px", flexShrink: 0 }}>Échanger</button>
                  <button onClick={() => removeItem("rewards", r.id)} style={{ background: "none", border: "none", color: "#3A4657", flexShrink: 0 }}>🗑</button>
                </div>
              </SysPanel>
            ))}
            {state.rewards.length === 0 && <Empty text="Aucune récompense définie. Ajoute un plaisir à débloquer avec ton or." />}
          </Section>
        )}
        {tab === "gallery" && (
          <Section title="Galerie" emoji="📸">
            {(!state.proofsHistory || state.proofsHistory.length === 0) ? (
              <Empty text="Aucune photo pour le moment. Active la preuve photo dans Perso pour commencer à documenter ton évolution." />
            ) : (
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 6 }}>
                {state.proofsHistory.map((p) => (
                  <button key={p.id} onClick={() => setLightbox(p)} style={{ padding: 0, border: "1px solid #233041", borderRadius: 8, overflow: "hidden", background: "#0F1621" }}>
                    <img src={p.img} alt={p.taskName} style={{ width: "100%", aspectRatio: "1/1", objectFit: "cover", display: "block" }} />
                    <div style={{ padding: "4px 6px", fontSize: 9, color: "#7C8896", fontFamily: "monospace", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                      {new Date(p.ts).toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" })}
                    </div>
                  </button>
                ))}
              </div>
            )}
          </Section>
        )}
        {tab === "nutrition" && (
          <NutritionTab
            foodLog={(state.foodLog && state.foodLog[todayStr()]) || []}
            plan={state.profile && state.profile.plan}
            onAdd={addFoodEntry}
            onRemove={removeFoodEntry}
          />
        )}
        {tab === "perso" && (
          <Section title="Personnage" emoji="🧑">
            {c.className && (
              <SysPanel accent="#E8B44A" className="mb2">
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ fontSize: 22 }}>{(CLASSES[Object.keys(CLASSES).find((k) => CLASSES[k].name === c.className)] || {}).emoji || "🎖️"}</span>
                  <div>
                    <div className="font-hud" style={{ fontWeight: 700, color: "#E8B44A", fontSize: 14 }}>{c.rank} {c.className}</div>
                    <div style={{ fontSize: 11, color: "#7C8896" }}>Classe déterminée lors de l'éveil</div>
                  </div>
                </div>
              </SysPanel>
            )}
            <SysPanel>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                {Object.entries(STATS).map(([k, s]) => (
                  <div key={k} style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ fontSize: 18 }}>{s.emoji}</span>
                    <div>
                      <div style={{ fontSize: 10, fontFamily: "monospace", color: "#7C8896" }}>{s.label}</div>
                      <div className="font-hud" style={{ fontWeight: 700, color: s.color }}>{c.stats[k] || 0}</div>
                    </div>
                  </div>
                ))}
              </div>
            </SysPanel>
            <div style={{ marginTop: 12 }}>
              <GlowButton
                accent="#FF5C5C"
                full
                active={!!state.requirePhoto}
                onClick={() => setState((prev) => ({ ...prev, requirePhoto: !prev.requirePhoto }))}
              >
                {state.requirePhoto ? "📷 Preuve photo : activée" : "📷 Activer la preuve photo"}
              </GlowButton>
              <div style={{ fontSize: 10, color: "#7C8896", marginTop: 6, lineHeight: 1.5 }}>
                Ouvre la caméra à chaque quête validée et garde une photo horodatée en preuve. Ce n'est pas une IA qui vérifie le mouvement — juste de quoi te rendre des comptes à toi-même.
              </div>
            </div>
            <div style={{ marginTop: 10 }}>
              <GlowButton
                accent="#7C8896"
                full
                onClick={() => {
                  if (window.confirm("Refaire le quiz d'éveil ? Ta progression actuelle reste intacte, seule ta classe sera redéfinie.")) {
                    setState((prev) => ({ ...prev, onboarded: false }));
                  }
                }}
              >
                🔄 Refaire le quiz d'éveil
              </GlowButton>
            </div>
          </Section>
        )}
      </div>

      {addingFor && <AddModal kind={addingFor} onClose={() => setAddingFor(null)} onSubmit={(p) => addItem(addingFor, p)} />}

      {taskDetail && (
        <TaskDetail
          kind={taskDetail.kind}
          item={taskDetail.item}
          requirePhoto={!!state.requirePhoto}
          onClose={() => setTaskDetail(null)}
          onStart={() => beginTask(taskDetail.kind, taskDetail.item)}
        />
      )}

      {captureFx && (
        <CaptureOverlay fx={captureFx} videoRef={videoRef} onCancel={cancelCapture} />
      )}

      {lightbox && (
        <div onClick={() => setLightbox(null)} style={{ position: "fixed", inset: 0, zIndex: 60, background: "rgba(0,0,0,.9)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 20 }}>
          <img src={lightbox.img} alt={lightbox.taskName} style={{ maxWidth: "100%", maxHeight: "70vh", borderRadius: 10, border: "1px solid #233041" }} />
          <div className="font-hud" style={{ marginTop: 12, fontSize: 13, color: "#E7ECEF" }}>{lightbox.taskName}</div>
          <div style={{ fontSize: 11, color: "#7C8896", fontFamily: "monospace", marginTop: 2 }}>{new Date(lightbox.ts).toLocaleString("fr-FR")}</div>
        </div>
      )}

      {/* persistent hidden video element used for candid capture during proof tasks */}
      <video ref={videoRef} playsInline muted style={{ position: "fixed", width: 1, height: 1, opacity: 0, pointerEvents: "none", top: 0, left: 0 }} />

      <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "rgba(10,14,20,.95)", backdropFilter: "blur(4px)", borderTop: "1px solid #1A2330", display: "flex", zIndex: 40 }}>
        {[
          { id: "dailies", emoji: "🔁", label: "Quotid." },
          { id: "habits", emoji: "⚔️", label: "Habitudes" },
          { id: "todos", emoji: "📋", label: "Quêtes" },
          { id: "rewards", emoji: "🎁", label: "Récomp." },
          { id: "gallery", emoji: "📸", label: "Galerie" },
          { id: "nutrition", emoji: "🍽️", label: "Nutri." },
          { id: "perso", emoji: "🧑", label: "Perso" },
        ].map((t) => (
          <button key={t.id} onClick={() => setTab(t.id)} className="font-hud" style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 2, padding: "10px 0", background: "none", border: "none", color: tab === t.id ? "#45E0D1" : "#4A5568" }}>
            <span style={{ fontSize: 16 }}>{t.emoji}</span>
            <span style={{ fontSize: 9 }}>{t.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

function Section({ title, emoji, children, onAdd }) {
  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
        <div className="font-hud" style={{ display: "flex", alignItems: "center", gap: 8, fontWeight: 600, fontSize: 14, textTransform: "uppercase", letterSpacing: .5 }}>
          <span>{emoji}</span>{title}
        </div>
        {onAdd && <button onClick={onAdd} style={{ width: 28, height: 28, borderRadius: 4, border: "1px solid #45E0D1", color: "#45E0D1", background: "none" }}>+</button>}
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>{children}</div>
    </div>
  );
}
function Empty({ text }) { return <div style={{ fontSize: 12, color: "#4A5568", fontFamily: "monospace", padding: "24px 0", textAlign: "center" }}>{text}</div>; }

function AddModal({ kind, onClose, onSubmit }) {
  const [text, setText] = useState("");
  const [description, setDescription] = useState("");
  const [stat, setStat] = useState("str");
  const [difficulty, setDifficulty] = useState("medium");
  const [negative, setNegative] = useState(false);
  const [heal, setHeal] = useState(false);
  const [cost, setCost] = useState(30);
  const titles = { habit: "Nouvelle habitude", daily: "Nouvelle quotidienne", todo: "Nouvelle quête", reward: "Nouvelle récompense" };

  function submit() {
    if (!text.trim()) return;
    if (kind === "reward") onSubmit({ text: text.trim(), cost: Math.max(1, Number(cost) || 1) });
    else if (kind === "habit") onSubmit({ text: text.trim(), stat, negative, heal: !negative && heal });
    else onSubmit({ text: text.trim(), description: description.trim(), stat, difficulty });
  }

  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, zIndex: 50, background: "rgba(0,0,0,.6)", display: "flex", alignItems: "flex-end", justifyContent: "center" }}>
      <div onClick={(e) => e.stopPropagation()} style={{ width: "100%", maxWidth: 480, background: "#0F1621", borderTop: "1px solid #233041", borderLeft: "1px solid #233041", borderRight: "1px solid #233041", borderRadius: "8px 8px 0 0", padding: "16px 16px 24px" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
          <div className="font-hud" style={{ fontWeight: 600, fontSize: 14 }}>{titles[kind]}</div>
          <button onClick={onClose} style={{ background: "none", border: "none", color: "#7C8896", fontSize: 18 }}>✕</button>
        </div>
        <input autoFocus value={text} onChange={(e) => setText(e.target.value)} placeholder="Texte..."
          style={{ width: "100%", background: "#131C27", border: "1px solid #233041", borderRadius: 4, padding: "8px 12px", fontSize: 14, outline: "none", color: "#E7ECEF", marginBottom: 12 }} />
        {(kind === "daily" || kind === "todo") && (
          <textarea value={description} onChange={(e) => setDescription(e.target.value)} placeholder="Description : que faut-il faire exactement ? (optionnel)" rows={3}
            style={{ width: "100%", background: "#131C27", border: "1px solid #233041", borderRadius: 4, padding: "8px 12px", fontSize: 13, outline: "none", color: "#E7ECEF", marginBottom: 12, resize: "vertical", fontFamily: "inherit" }} />
        )}
        {kind === "reward" ? (
          <div style={{ marginBottom: 12 }}>
            <div style={{ fontSize: 11, fontFamily: "monospace", color: "#7C8896", marginBottom: 4 }}>Coût en or</div>
            <input type="number" value={cost} onChange={(e) => setCost(e.target.value)}
              style={{ width: "100%", background: "#131C27", border: "1px solid #233041", borderRadius: 4, padding: "8px 12px", fontSize: 14, outline: "none", color: "#E7ECEF" }} />
          </div>
        ) : (
          <React.Fragment>
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontSize: 11, fontFamily: "monospace", color: "#7C8896", marginBottom: 4 }}>Statistique liée</div>
              <StatPicker value={stat} onChange={setStat} />
            </div>
            {kind === "habit" ? (
              <div style={{ marginBottom: 12, display: "flex", gap: 6 }}>
                <button onClick={() => { setNegative(false); setHeal(false); }} className="font-hud" style={{ flex: 1, padding: "8px 0", borderRadius: 4, fontSize: 11.5, border: "1px solid " + (!negative && !heal ? "#4ADE80" : "#233041"), color: !negative && !heal ? "#4ADE80" : "#7C8896", background: "none" }}>Bonne (+)</button>
                <button onClick={() => { setNegative(true); setHeal(false); }} className="font-hud" style={{ flex: 1, padding: "8px 0", borderRadius: 4, fontSize: 11.5, border: "1px solid " + (negative ? "#FF5C5C" : "#233041"), color: negative ? "#FF5C5C" : "#7C8896", background: "none" }}>Mauvaise (-)</button>
                <button onClick={() => { setNegative(false); setHeal(true); }} className="font-hud" style={{ flex: 1, padding: "8px 0", borderRadius: 4, fontSize: 11.5, border: "1px solid " + (heal ? "#FF7FC1" : "#233041"), color: heal ? "#FF7FC1" : "#7C8896", background: "none" }}>Soin ❤️</button>
              </div>
            ) : (
              <div style={{ marginBottom: 12 }}>
                <div style={{ fontSize: 11, fontFamily: "monospace", color: "#7C8896", marginBottom: 4 }}>Difficulté</div>
                <DiffPicker value={difficulty} onChange={setDifficulty} />
              </div>
            )}
          </React.Fragment>
        )}
        <button onClick={submit} className="font-hud" style={{ width: "100%", background: "#45E0D1", color: "#0A0E14", fontWeight: 600, fontSize: 14, border: "none", borderRadius: 4, padding: "10px 0", marginTop: 4 }}>Ajouter</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
