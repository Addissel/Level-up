<html lang="fr">
<head>

<link rel="manifest" href="manifest.json" />

<style>
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #0A0E14; color: #E7ECEF; font-family: 'Inter', system-ui, sans-serif; }
  .font-hud { font-family: 'Chakra Petch', sans-serif; }
  input, button { font-family: inherit; }

<body>
<div id="root">
  <pre id="boot-status" style="color:#7C8896;padding:16px;font-family:monospace;font-size:12px;white-space:pre-wrap;">Chargement des scripts...</pre>
</div>

<script>
  window.addEventListener('error', function (e) {
    var el = document.getElementById('boot-status') || document.getElementById('root');
    var msg = 'ERREUR: ' + (e.message || 'inconnue') + '\nFichier: ' + (e.filename || '?') + '\nLigne: ' + (e.lineno || '?');
    el.style.color = '#FF5C5C';
    el.textContent = msg;
    console.error(e);
  });
</script>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" onload="document.getElementById('boot-status').textContent='React chargé...'"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" onload="document.getElementById('boot-status').textContent='ReactDOM chargé...'"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" onload="document.getElementById('boot-status').textContent='Babel chargé, compilation en cours...'"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const STATS = {
  str: { label: "Force", emoji: "💪", color: "#FF6B5C" },
  end: { label: "Vitalité", emoji: "❤️", color: "#4ADE80" },
  disc: { label: "Discipline", emoji: "🛡️", color: "#5CC8FF" },
  int: { label: "Mental", emoji: "🧠", color: "#C084FC" },
};

const DIFF = {
  easy: { label: "Facile", mult: 1 },
  medium: { label: "Moyen", mult: 1.5 },
  hard: { label: "Difficile", mult: 2 },
  epic: { label: "Épique", mult: 3 },
};

const BASE_XP = 10;
const BASE_GOLD = 5;
const STORAGE_KEY = "levelup-rpg-state-v1";

const todayStr = () => new Date().toISOString().slice(0, 10);
const uid = () => Math.random().toString(36).slice(2, 10);

const defaultState = () => ({
  character: { name: "Aventurier", level: 1, xp: 0, gold: 0, hp: 50, maxHp: 50, stats: { str: 0, end: 0, disc: 0, int: 0 } },
  habits: [
    { id: uid(), text: "Faire 20 pompes", stat: "str" },
    { id: uid(), text: "Manger un fast-food", stat: "end", negative: true },
  ],
  dailies: [
    { id: uid(), text: "Séance de sport", stat: "str", difficulty: "medium", done: false, streak: 0 },
    { id: uid(), text: "10 min d'étirements", stat: "end", difficulty: "easy", done: false, streak: 0 },
  ],
  todos: [{ id: uid(), text: "Planifier le programme de la semaine", stat: "disc", difficulty: "easy", done: false }],
  rewards: [
    { id: uid(), text: "1h de jeu vidéo", cost: 40 },
    { id: uid(), text: "Session VR", cost: 60 },
  ],
  lastLogin: todayStr(),
});

function xpToNext(level) { return 100 + (level - 1) * 40; }

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return defaultState();
}
function saveState(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function SysPanel({ children, className = "", accent = "#45E0D1" }) {
  return (
    <div className={"relative " + className}>
      <div style={{ position: "absolute", top: -1, left: -1, width: 12, height: 12, borderTop: "2px solid " + accent, borderLeft: "2px solid " + accent }} />
      <div style={{ position: "absolute", top: -1, right: -1, width: 12, height: 12, borderTop: "2px solid " + accent, borderRight: "2px solid " + accent }} />
      <div style={{ position: "absolute", bottom: -1, left: -1, width: 12, height: 12, borderBottom: "2px solid " + accent, borderLeft: "2px solid " + accent }} />
      <div style={{ position: "absolute", bottom: -1, right: -1, width: 12, height: 12, borderBottom: "2px solid " + accent, borderRight: "2px solid " + accent }} />
      <div style={{ border: "1px solid #233041", background: "#0F1621", padding: "12px 16px" }}>{children}</div>
    </div>
  );
}

function Bar({ value, max, color, height = 8 }) {
  const pct = Math.max(0, Math.min(100, (value / max) * 100));
  return (
    <div style={{ width: "100%", background: "#1A2330", borderRadius: 2, overflow: "hidden", height }}>
      <div style={{ height: "100%", width: pct + "%", background: color, boxShadow: "0 0 8px " + color + "99", transition: "width .5s" }} />
    </div>
  );
}

function StatChip({ statKey, value }) {
  const s = STATS[statKey];
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 6, background: "#131C27", border: "1px solid #233041", borderRadius: 4, padding: "4px 8px" }}>
      <span style={{ fontSize: 12 }}>{s.emoji}</span>
      <span style={{ fontSize: 11, fontFamily: "monospace", color: s.color }}>{value}</span>
    </div>
  );
}

function DiffPicker({ value, onChange }) {
  return (
    <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
      {Object.entries(DIFF).map(([k, d]) => (
        <button key={k} onClick={() => onChange(k)}
          style={{ padding: "6px 8px", fontSize: 11, fontFamily: "monospace", borderRadius: 4,
            border: "1px solid " + (value === k ? "#45E0D1" : "#233041"),
            color: value === k ? "#45E0D1" : "#7C8896",
            background: value === k ? "#45E0D122" : "transparent" }}>
          {d.label}
        </button>
      ))}
    </div>
  );
}

function StatPicker({ value, onChange }) {
  return (
    <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
      {Object.entries(STATS).map(([k, s]) => (
        <button key={k} onClick={() => onChange(k)}
          style={{ padding: "6px 8px", display: "flex", alignItems: "center", gap: 4, fontSize: 11, fontFamily: "monospace", borderRadius: 4,
            border: "1px solid " + (value === k ? s.color : "#233041"),
            color: value === k ? s.color : "#7C8896",
            background: value === k ? s.color + "22" : "transparent" }}>
          <span>{s.emoji}</span>{s.label}
        </button>
      ))}
    </div>
  );
}

function App() {
  const [state, setState] = useState(null);
  const [tab, setTab] = useState("dailies");
  const [toast, setToast] = useState(null);
  const [levelUpFx, setLevelUpFx] = useState(false);
  const [addingFor, setAddingFor] = useState(null);
  const toastTimer = useRef(null);

  useEffect(() => {
    let loaded = loadState();
    const today = todayStr();
    if (loaded.lastLogin !== today) {
      let hp = loaded.character.hp;
      loaded.dailies = loaded.dailies.map((d) => {
        if (!d.done) { hp -= Math.round(3 * DIFF[d.difficulty].mult); return { ...d, done: false, streak: 0 }; }
        return { ...d, done: false, streak: (d.streak || 0) + 1 };
      });
      loaded.character.hp = Math.max(0, hp);
      loaded.lastLogin = today;
    }
    setState(loaded);
  }, []);

  useEffect(() => { if (state) saveState(state); }, [state]);

  function showToast(msg, color = "#45E0D1") {
    setToast({ msg, color });
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2200);
  }

  function applyReward(statKey, mult = 1) {
    setState((prev) => {
      const c = { ...prev.character, stats: { ...prev.character.stats } };
      const gainedXp = Math.round(BASE_XP * mult);
      const gainedGold = Math.round(BASE_GOLD * mult);
      c.xp += gainedXp; c.gold += gainedGold;
      if (statKey) c.stats[statKey] = (c.stats[statKey] || 0) + Math.max(1, Math.round(mult));
      let leveled = false, need = xpToNext(c.level);
      while (c.xp >= need) { c.xp -= need; c.level += 1; c.maxHp += 5; c.hp = c.maxHp; leveled = true; need = xpToNext(c.level); }
      if (leveled) { setLevelUpFx(true); setTimeout(() => setLevelUpFx(false), 1800); showToast("NIVEAU " + c.level + " ATTEINT", "#E8B44A"); }
      else { showToast("+" + gainedXp + " XP  +" + gainedGold + " or", "#45E0D1"); }
      return { ...prev, character: c };
    });
  }
  function applyPenalty(mult = 1) {
    setState((prev) => {
      const c = { ...prev.character };
      const dmg = Math.round(4
